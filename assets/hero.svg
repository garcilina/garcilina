<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Lina Garci Full Stack and Mobile Developer animated banner">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050a18"/><stop offset=".6" stop-color="#101c39"/><stop offset="1" stop-color="#24133c"/></linearGradient>
<linearGradient id="ink"><stop stop-color="#effcff"/><stop offset=".5" stop-color="#b7efff"/><stop offset="1" stop-color="#b9a0ff"/></linearGradient>
