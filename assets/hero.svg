<radialGradient id="glow"><stop stop-color="#46d6ed" stop-opacity=".25"/><stop offset="1" stop-color="#46d6ed" stop-opacity="0"/></radialGradient>
<style>
.float{animation:float 6s ease-in-out infinite}.slow{animation:float 8s ease-in-out infinite reverse}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-origin:1030px 205px;animation:turn 35s linear infinite}.scan{animation:scan 5s ease-in-out infinite}.name{animation:shine 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(120px);opacity:1}}@keyframes shine{0%,100%{opacity:.9}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
